[project]
name = "mseml"
version = "0.2.0"
description = "EMA 5937 template"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "astropy>=6",
    "fsspec>=2024.6",
    "irohds>=0.3",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mseml"]

[tool.ruff]
line-length = 100
